name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all

      - name: build (release)
        run: cargo build --release

      - name: smoke run
        run: |
          ./target/release/hiddify-parser run --max-nodes 20 --connect-timeout-ms 2000 --out sub-ci
          test -s sub-ci/subscription.txt
          test -s sub-ci/vless.txt
          cat sub-ci/report.json
