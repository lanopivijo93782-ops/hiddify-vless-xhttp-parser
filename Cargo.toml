[package]
name = "hiddify-vless-xhttp-parser"
version = "0.1.0"
edition = "2021"
description = "Aggregates VLESS + XHTTP configs from public sources, keeps only nodes hosted on known CDN/ISP networks (VK, Yandex, Cloudflare, Beeline, ...), speed-tests them and emits a Hiddify-ready subscription."
license = "MIT"
repository = "https://github.com/lanopivijo93782-ops/hiddify-vless-xhttp-parser"

[[bin]]
name = "hiddify-parser"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
ipnetwork = "0.20"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "socks", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
